[workspace]
resolver = "2"
members = [
    "framework/*",
    "runtime/*",
    "hw/*",
    "debug/*",
]

default-members = [
    "runtime/helm-engine",
    "runtime/helm-cli",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["helm-ng contributors"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/pmallapp/helm-ng"

[workspace.dependencies]
# Internal — framework (instrumentation-v2)
helm-probe   = { path = "framework/helm-probe" }
helm-diag    = { path = "framework/helm-diag" }

# Internal — debug (analysis + delivery)
helm-spy     = { path = "debug/helm-spy" }
helm-report  = { path = "debug/helm-report" }

# Internal — framework
helm-core    = { path = "framework/helm-core" }
helm-decode  = { path = "framework/helm-decode" }
helm-event   = { path = "framework/helm-event" }
helm-stats   = { path = "framework/helm-stats" }
helm-memory  = { path = "framework/helm-memory" }
helm-timing  = { path = "framework/helm-timing" }
helm-devices = { path = "framework/helm-devices" }
helm-plugin  = { path = "framework/helm-plugin" }

# Internal — hardware
helm-hw-char   = { path = "hw/helm-hw-char" }
helm-hw-timer  = { path = "hw/helm-hw-timer" }
helm-hw-rtc    = { path = "hw/helm-hw-rtc" }
helm-hw-dma    = { path = "hw/helm-hw-dma" }
helm-hw-intc   = { path = "hw/helm-hw-intc" }
helm-hw-pci    = { path = "hw/helm-hw-pci" }
helm-hw-iommu  = { path = "hw/helm-hw-iommu" }
helm-hw-virtio = { path = "hw/helm-hw-virtio" }

# Internal — runtime
helm-arch     = { path = "runtime/helm-arch" }
helm-debug    = { path = "runtime/helm-debug" }
helm-engine   = { path = "runtime/helm-engine" }
helm-platform = { path = "runtime/helm-platform" }
helm-python   = { path = "runtime/helm-python" }

# External — instrumentation-v2
dashmap    = "6"

# External
libc       = "0.2"
thiserror  = "1"
log        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3       = { version = "0.22", features = ["abi3-py39"] }
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic     = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto           = true
codegen-units = 1
panic         = "abort"
