[workspace]
resolver = "2"
members = [
    "framework/*",
    "runtime/*",
    "hw/*",
    "debug/*",
]

default-members = [
    "runtime/helm-engine",
    "runtime/helm-cli",
    "runtime/helm-python",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["helm-ng contributors"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/pmallapp/helm-ng"

[workspace.dependencies]
# Internal — framework (instrumentation-v2)
helm-probe   = { path = "framework/helm-probe" }
helm-diag    = { path = "framework/helm-diag" }

# Internal — debug (analysis + delivery)
helm-spy     = { path = "debug/helm-spy" }
helm-report  = { path = "debug/helm-report" }

# Internal — framework
helm-core    = { path = "framework/helm-core" }
helm-decode  = { path = "framework/helm-decode" }
helm-event   = { path = "framework/helm-event" }
helm-stats   = { path = "framework/helm-stats" }
helm-memory  = { path = "framework/helm-memory" }
helm-timing  = { path = "framework/helm-timing" }
helm-devices = { path = "framework/helm-devices" }
helm-plugin  = { path = "framework/helm-plugin" }
helm-jit     = { path = "framework/helm-jit" }

# Internal — hardware
helm-hw-char   = { path = "hw/helm-hw-char" }
helm-hw-timer  = { path = "hw/helm-hw-timer" }
helm-hw-rtc    = { path = "hw/helm-hw-rtc" }
helm-hw-dma    = { path = "hw/helm-hw-dma" }
helm-hw-intc   = { path = "hw/helm-hw-intc" }
helm-hw-pci    = { path = "hw/helm-hw-pci" }
helm-hw-iommu  = { path = "hw/helm-hw-iommu" }
helm-hw-virtio = { path = "hw/helm-hw-virtio" }

# Internal — runtime
helm-arch     = { path = "runtime/helm-arch" }
helm-debug    = { path = "runtime/helm-debug" }
helm-engine   = { path = "runtime/helm-engine" }
helm-platform = { path = "runtime/helm-platform" }
helm-python   = { path = "runtime/helm-python" }

# External — instrumentation-v2
dashmap    = "6"

# External
libc       = "0.2"
thiserror  = "1"
log        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3       = { version = "0.22", features = ["abi3-py39"] }
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic     = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assigning_clones = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
doc_overindented_list_items = "allow"
elidable_lifetime_names = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_collect = "allow"
format_push_string = "allow"
inline_always = "allow"
identity_op = "allow"
items_after_statements = "allow"
iter_cloned_collect = "allow"
large_stack_arrays = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_let_else = "allow"
manual_range_contains = "allow"
map_unwrap_or = "allow"
many_single_char_names = "allow"
manual_memcpy = "allow"
match_same_arms = "allow"
missing_fields_in_debug = "allow"
needless_pass_by_value = "allow"
needless_return = "allow"
option_as_ref_cloned = "allow"
ptr_cast_constness = "allow"
ptr_as_ptr = "allow"
cast_ptr_alignment = "allow"
pub_underscore_fields = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
same_item_push = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
bool_to_int_with_if = "allow"
collapsible_else_if = "allow"
comparison_chain = "allow"
default_constructed_unit_structs = "allow"
derivable_impls = "allow"
duplicated_attributes = "allow"
empty_line_after_outer_attr = "allow"
enum_glob_use = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
manual_range_patterns = "allow"
match_single_binding = "allow"
match_wildcard_for_single_variants = "allow"
neg_cmp_op_on_partial_ord = "allow"
no_effect_underscore_binding = "allow"
similar_names = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
unnecessary_literal_bound = "allow"
unnecessary_map_or = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unusual_byte_groupings = "allow"
used_underscore_binding = "allow"
verbose_bit_mask = "allow"
wildcard_imports = "allow"

[profile.release]
lto           = true
codegen-units = 1
panic         = "abort"
