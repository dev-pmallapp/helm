[package]
name        = "helm-cli"
version.workspace = true
edition.workspace = true
description = "Command-line launchers for the helm-ng simulator"

[lints]
workspace = true

[[bin]]
name = "helm-aarch64"
path = "src/bin/helm_aarch64.rs"

[[bin]]
name = "helm-system-aarch64"
path = "src/bin/helm_system_aarch64.rs"

[[bin]]
name = "helm-riscv64"
path = "src/bin/helm_riscv64.rs"

[dependencies]
helm-python.workspace = true
helm-engine.workspace = true
helm-timing.workspace = true
helm-diag.workspace   = true
helm-arch.workspace   = true
helm-platform.workspace = true
anyhow.workspace      = true
env_logger.workspace  = true
log.workspace         = true
pyo3 = { version = "0.22", features = ["auto-initialize"] }

[features]
default = ["jit-dynasm"]
jit = ["helm-python/jit"]
jit-dynasm = ["jit", "helm-python/jit-dynasm"]
jit-stencil = ["jit", "helm-python/jit-stencil"]
jit-tiered = ["jit", "helm-python/jit-tiered"]
