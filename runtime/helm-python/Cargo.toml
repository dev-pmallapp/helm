[package]
name    = "helm-python"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name       = "_helm_ng"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable when building as a Python extension (.so via maturin).
# The binary launcher (helm-aarch64) does NOT enable this.
extension-module = ["pyo3/extension-module"]
instrumentation = ["helm-spy/instrumentation", "helm-engine/instrumentation", "helm-debug/instrumentation"]
jit = ["helm-engine/jit"]
haj = ["jit", "helm-engine/haj"]
jit-dynasm = ["jit", "helm-engine/jit-dynasm"]
jit-stencil = ["jit", "helm-engine/jit-stencil"]
jit-tiered = ["haj"]

[dependencies]
helm-engine.workspace = true
helm-diag.workspace   = true
helm-debug.workspace  = true
helm-core.workspace   = true
helm-spy.workspace    = true
helm-report.workspace = true
helm-devices.workspace = true
helm-platform.workspace = true
pyo3 = { version = "0.22", features = ["abi3-py39"] }
log.workspace = true
thiserror.workspace = true
indexmap = "2"
