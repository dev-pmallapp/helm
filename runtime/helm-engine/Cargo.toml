[package]
name    = "helm-engine"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
helm-core.workspace    = true
helm-probe.workspace   = true
helm-arch.workspace    = true
helm-diag.workspace    = true
helm-event.workspace   = true
helm-stats.workspace   = true
helm-timing.workspace  = true
helm-memory.workspace  = true
helm-devices.workspace = true
helm-hw-char.workspace = true
helm-hw-firmware.workspace = true
helm-hw-rtc.workspace = true
helm-hw-intc = { workspace = true, features = ["probe"] }
helm-hw-iommu.workspace = true
helm-hw-pci.workspace = true
helm-hw-virtio.workspace = true
helm-debug.workspace   = true
helm-plugin.workspace  = true
helm-platform.workspace = true
helm-spy              = { workspace = true, optional = true }
libc.workspace         = true
thiserror.workspace    = true
log.workspace          = true
flate2                = "1"
helm-jit              = { workspace = true, optional = true }

[features]
instrumentation = ["helm-probe/instrumentation", "dep:helm-spy", "helm-spy/instrumentation"]
jit = ["dep:helm-jit"]
haj = ["jit-tiered"]
jit-dynasm = ["jit", "helm-jit/backend-dynasm"]
jit-stencil = ["jit", "helm-jit/backend-stencil"]
jit-tiered = ["jit-stencil", "jit-dynasm"]

[dev-dependencies]
helm-hw-timer.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "jit_mips"
harness = false
required-features = ["jit-dynasm"]
